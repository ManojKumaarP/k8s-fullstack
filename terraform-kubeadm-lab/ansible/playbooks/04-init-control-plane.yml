
---
- name: Initialize Kubernetes Control Plane
  hosts: control_plane
  become: true
  gather_facts: true

  vars:
    control_plane_ip: "10.70.0.50"
    pod_network_cidr: "192.168.0.0/16"
    cri_socket: "unix:///run/containerd/containerd.sock"
    kubeconfig_path: "/home/ubuntu/.kube/config"

  tasks:

    - name: Verify control plane IP
      ansible.builtin.assert:
        that:
          - ansible_default_ipv4.address == control_plane_ip
        fail_msg: "Control plane IP does not match expected IP"

    - name: Initialize Kubernetes cluster
      ansible.builtin.command:
        argv:
          - kubeadm
          - init
          - --apiserver-advertise-address={{ control_plane_ip }}
          - --pod-network-cidr={{ pod_network_cidr }}
          - --cri-socket={{ cri_socket }}
      args:
        creates: /etc/kubernetes/admin.conf

    - name: Verify Kubernetes admin configuration
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_config

    - name: Confirm control plane initialization
      ansible.builtin.assert:
        that:
          - admin_config.stat.exists
        fail_msg: "Kubernetes initialization was unsuccessful"

    # Configure kubectl for ubuntu user
    - name: Create .kube directory for ubuntu
      ansible.builtin.file:
        path: /home/ubuntu/.kube
        state: directory
        owner: ubuntu
        group: ubuntu
        mode: '0755'

    - name: Copy Kubernetes admin configuration
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: "{{ kubeconfig_path }}"
        remote_src: true
        owner: ubuntu
        group: ubuntu
        mode: '0600'

    - name: Set kubectl context
      ansible.builtin.command:
        cmd: kubectl config use-context kubernetes-admin@kubernetes
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      become_user: ubuntu
      register: kubectl_context
      changed_when: "'Switched to context' in kubectl_context.stdout"

    - name: Verify active kubectl context
      ansible.builtin.command:
        cmd: kubectl config current-context
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      become_user: ubuntu
      register: current_context
      changed_when: false

    - name: Display active kubectl context
      ansible.builtin.debug:
        var: current_context.stdout

    - name: Check Kubernetes nodes
      ansible.builtin.command:
        cmd: kubectl get nodes
      environment:
        KUBECONFIG: "{{ kubeconfig_path }}"
      become_user: ubuntu
      register: kubernetes_nodes
      changed_when: false

    - name: Display control plane status
      ansible.builtin.debug:
        var: kubernetes_nodes.stdout_lines