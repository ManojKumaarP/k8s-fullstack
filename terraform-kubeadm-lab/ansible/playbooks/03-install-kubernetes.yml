
---
- name: Install Kubernetes components
  hosts: all
  become: true

  tasks:
    - name: Install required dependencies
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - curl
          - gpg
        state: present
        update_cache: true

    - name: Create Kubernetes keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: '0755'

    - name: Download Kubernetes repository signing key
      ansible.builtin.get_url:
        url: https://pkgs.k8s.io/core:/stable:/v1.37/deb/Release.key
        dest: /tmp/kubernetes-release.key
        mode: '0644'

    - name: Convert Kubernetes signing key
      ansible.builtin.command:
        cmd: gpg --dearmor --batch --yes -o /etc/apt/keyrings/kubernetes-apt-keyring.gpg /tmp/kubernetes-release.key
      args:
        creates: /etc/apt/keyrings/kubernetes-apt-keyring.gpg

    - name: Set Kubernetes keyring permissions
      ansible.builtin.file:
        path: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        mode: '0644'

    - name: Add Kubernetes v1.37 repository
      ansible.builtin.deb822_repository:
        name: kubernetes
        types: deb
        uris: https://pkgs.k8s.io/core:/stable:/v1.37/deb/
        suites: /
        signed_by: /etc/apt/keyrings/kubernetes-apt-keyring.gpg
        state: present

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true

    - name: Install kubelet kubeadm and kubectl
      ansible.builtin.apt:
        name:
          - kubelet
          - kubeadm
          - kubectl
        state: present
        update_cache: true

    - name: Hold Kubernetes packages
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop:
        - kubelet
        - kubeadm
        - kubectl

    - name: Enable and start kubelet service
      ansible.builtin.systemd:
        name: kubelet
        enabled: true
        state: started

    - name: Verify kubeadm version
      ansible.builtin.command: kubeadm version -o short
      register: kubeadm_version
      changed_when: false

    - name: Verify kubelet version
      ansible.builtin.command: kubelet --version
      register: kubelet_version
      changed_when: false

    - name: Verify kubectl version
      ansible.builtin.command: kubectl version --client
      register: kubectl_version
      changed_when: false

    - name: Display installed versions
      ansible.builtin.debug:
        msg:
          - "Node: {{ inventory_hostname }}"
          - "{{ kubeadm_version.stdout }}"
          - "{{ kubelet_version.stdout }}"
          - "{{ kubectl_version.stdout }}"
