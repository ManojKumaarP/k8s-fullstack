- name: Install Calico CNI
  hosts: control_plane
  become: true
  gather_facts: false

  environment:
    KUBECONFIG: /etc/kubernetes/admin.conf

  tasks:
  
    - name: Install Calico native CRDs
      ansible.builtin.command:
        cmd: >
          kubectl apply --server-side --force-conflicts -f
          https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/v3_projectcalico_org.yaml
      changed_when: true


    - name: Install Tigera Operator
      ansible.builtin.command:
        cmd: >
          kubectl apply -f
          https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/tigera-operator.yaml
      changed_when: true

    - name: Wait for Calico Installation CRD
      ansible.builtin.command:
        cmd: >
          kubectl wait --for=condition=Established
          --timeout=180s
          crd/installations.operator.tigera.io
      changed_when: false

    - name: Install Calico custom resources
      ansible.builtin.command:
        cmd: >
          kubectl apply -f
          https://raw.githubusercontent.com/projectcalico/calico/v3.33.0/manifests/custom-resources.yaml
      changed_when: true

    - name: Wait for Calico components
      ansible.builtin.command:
        cmd: >
          kubectl wait
          --for=condition=Available
          deployment/tigera-operator
          -n tigera-operator
          --timeout=180s
      changed_when: false

    - name: Display Calico installation status
      ansible.builtin.command:
        cmd: kubectl get pods -A
      register: calico_pods
      changed_when: false

    - name: Show pod status
      ansible.builtin.debug:
        var: calico_pods.stdout_lines
