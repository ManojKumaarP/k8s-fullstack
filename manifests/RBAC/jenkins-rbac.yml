
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: fullstack
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: jenkins-deployer-role
  namespace: fullstack
rules:
  # Update and check only the existing application Deployments
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames: ["backend", "frontend"]
    verbs: ["get", "patch", "watch"]

  # Inspect rollout-related Pods
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]

  # Inspect ReplicaSets during rollout
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer-binding
  namespace: fullstack
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: fullstack
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: jenkins-deployer-role
