apiVersion: v1
kind: ConfigMap
metadata: 
  name: nginx-config
  namespace: fullstack
data:
  nginx.conf: |
    events {}
    http {
      server{
            listen 80;

            location /api/ {
                proxy_pass http://backend-service:8080;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            }

            location / {
                proxy_pass http://frontend-service:80;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
            } 
        }
    }
